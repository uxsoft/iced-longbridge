[workspace]
members = [
    "crates/iced-longbridge",
    "crates/demo",
    "crates/demo-app",
    "crates/demo-web",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/uxsoft/iced-longbridge"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Moderate tightening without drowning component code in pedantic noise.
# `unwrap_used` is deliberately left at default — too much existing code
# relies on it in test helpers; sweep separately.
too_many_arguments = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
