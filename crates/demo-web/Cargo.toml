[package]
name = "demo-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "demo-web"
path = "src/main.rs"

[dependencies]
demo = { path = "../demo" }
# Web builds use the webgl renderer. Tokio is not available on WASM —
# iced falls back to the browser's event loop automatically.
iced = { version = "0.14", features = ["advanced", "canvas", "svg", "image", "lazy", "webgl"] }
