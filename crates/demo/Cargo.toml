[package]
name = "demo"
version = "0.1.0"
edition = "2024"

[dependencies]
iced-longbridge = { path = "../iced-longbridge" }
iced = { version = "0.14", features = ["advanced", "canvas", "svg", "image", "lazy", "tokio"] }
tokio = { version = "1", features = ["time", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
