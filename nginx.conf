server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /usr/share/nginx/html;
    index index.html;

    # Serve WASM with the correct MIME type so the browser streams-compiles it.
    types {
        application/wasm  wasm;
    }

    # Baseline security headers for a static WASM demo.
    add_header X-Content-Type-Options "nosniff"           always;
    add_header X-Frame-Options        "DENY"              always;
    add_header Referrer-Policy        "no-referrer"       always;
    add_header Permissions-Policy     "interest-cohort=()" always;
    # wasm-bindgen needs `wasm-unsafe-eval`; everything else stays same-origin.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
        always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the hashed build artefacts.
    location ~* \.(wasm|js|css|png|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
