name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: build · test · clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: Install system deps for iced native build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev \
            libxcb1-dev libx11-dev libgl1-mesa-dev

      - name: cargo build (native demo)
        run: cargo build -p demo-app

      - name: cargo build (wasm demo)
        run: cargo build -p demo-web --target wasm32-unknown-unknown

      - name: cargo test (library)
        run: cargo test -p iced-longbridge --lib

      - name: cargo clippy (workspace, informational)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run audit
        run: cargo audit

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
