name: Release

on:
  push:
    tags:
      - 'v*'
    branches: [master]
    paths: ['.github/release-trigger.json']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            git tag -l --format='%(contents)' "$TAG" > /tmp/notes.md
          else
            TAG=$(jq -r .tag .github/release-trigger.json)
            jq -r .notes .github/release-trigger.json > /tmp/notes.md
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" HEAD -F /tmp/notes.md
            git push origin "$TAG"
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/notes.md \
            --target master
